name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# Actions are pinned to a commit, not to a branch or tag that can be moved.
# .github/dependabot.yml proposes the updates, so hassfest and the Marketplace
# validator still follow their upstream.

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-11-12

  # The Marketplace's validator still runs as the HACS action.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-11-12
        with:
          category: integration

  # Everything the Marketplace installs is plain source kept here: no bundles, no
  # frameworks, nothing built from another repository.
  shipped-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check_shipped_source.py
